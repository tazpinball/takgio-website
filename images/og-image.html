<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    /* Source for images/og-image.png — rendered at 1200x630 via headless Edge:
       msedge --headless=new --hide-scrollbars --window-size=1200,630
              --screenshot=<abs path>\og-image.png file:///<abs path>/og-image.html
       Every figure here must match the verified figures on the site. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #0b0d1c; color: #fff; position: relative;
    }
    .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .6; }
    .b1 { width: 560px; height: 560px; background: #4a6cf7; top: -220px; left: -160px; }
    .b2 { width: 520px; height: 520px; background: #14b8a6; bottom: -260px; right: 120px; opacity: .5; }
    .b3 { width: 420px; height: 420px; background: #a855f7; top: 60px; right: -180px; opacity: .45; }
    .grid { position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 48px 48px; }
    .frame { position: relative; z-index: 2; height: 100%; padding: 56px 64px; display: grid; grid-template-columns: 1.25fr 1fr; gap: 36px; }
    .left { display: flex; flex-direction: column; justify-content: space-between; }
    .top { display: flex; align-items: center; gap: 14px; }
    .wordmark { font-size: 34px; font-weight: 800; letter-spacing: .04em; }
    .dots { display: flex; gap: 8px; }
    .dots span { width: 12px; height: 12px; border-radius: 50%; }
    h1 { font-size: 66px; font-weight: 800; line-height: 1.04; letter-spacing: -0.02em; }
    h1 em { font-style: normal; background: linear-gradient(90deg, #7aa2ff, #2dd4bf); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { margin-top: 18px; font-size: 24px; line-height: 1.4; color: rgba(255,255,255,.78); }
    .sub b { color: #fff; }
    .foot { display: flex; align-items: center; gap: 18px; font-size: 19px; color: rgba(255,255,255,.6); font-weight: 600; }
    .foot .url { color: #7aa2ff; }
    .right { position: relative; }
    .card { position: absolute; border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,.18); box-shadow: 0 24px 60px rgba(0,0,0,.5); }
    .panda { width: 400px; top: 10px; right: 0; transform: rotate(3deg); }
    .panda img { display: block; width: 100%; }
    .ciq { width: 300px; left: 0; top: 230px; background: #0f172a; padding: 18px 20px; border-color: rgba(45,212,191,.5); transform: rotate(-3deg); }
    .ciq img { width: 190px; display: block; margin-bottom: 8px; }
    .ciq .k { font-size: 15px; color: rgba(255,255,255,.7); }
    .ciq .v { font-size: 42px; font-weight: 800; color: #2dd4bf; letter-spacing: -0.02em; }
    .chip { position: absolute; padding: 10px 16px; border-radius: 999px; font-size: 18px; font-weight: 700;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); }
    .c1 { left: 10px; bottom: 88px; } .c1 i { color: #fbbf24; font-style: normal; }
    .c2 { right: 40px; bottom: 30px; background: rgba(122,162,255,.22); border-color: rgba(122,162,255,.5); }
  </style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="grid"></div>
  <div class="frame">
    <div class="left">
      <div class="top">
        <img src="brand/takgio-lockup-white.svg" alt="" style="height:52px;display:block">
      </div>
      <div>
        <h1>We build AI products &mdash; and we <em>ship</em> them.</h1>
        <p class="sub">Five products shipped since March 2026, led by <b>ConcreteIQ</b> and <b>Brickture</b>. Now building for <b>Meta Ray-Ban Display</b>.</p>
      </div>
      <div class="foot"><span>&#10035; Built with Claude by Anthropic</span><span class="url">www.takgio.com</span></div>
    </div>
    <div class="right">
      <div class="card panda"><img src="products/brickture-build-lion.webp" alt=""></div>
      <div class="card ciq">
        <img src="products/concreteiq-logo-dark.png" alt="">
        <div class="k">Missing steel surfaced on a live bid</div>
        <div class="v">$144,219</div>
      </div>
      <div class="chip c1"><i>&#9733;&#9733;&#9733;&#9733;&#9733;</i> 5.0 on the App Store</div>
      <div class="chip c2">20 days to the App Store</div>
    </div>
  </div>
</body>
</html>
